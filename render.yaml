# Blocco 6 — voice-orchestrator on Render: web service + voice worker +
# Postgres. Apply from the Render dashboard: New → Blueprint → this repo.
# Secrets marked `sync: false` are asked for once, on first apply.
# Plans (Oct 2026 list prices): web 0.5c-512mb $7, worker 1c-2g $25 (the
# worker OOMs at 512 MB — docs/ROADMAP.md D7), Postgres 0.1c-256mb $6.

databases:
  - name: voice-orchestrator-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: voice_orchestrator
    user: voice_orchestrator
    ipAllowList: []  # reachable only from Render services in this account

envVarGroups:
  - name: voice-orchestrator-voice
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

services:
  - type: web
    name: voice-orchestrator-web
    runtime: docker
    dockerfilePath: ./deploy/web.Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VOICE_ORCH_DATABASE_URL
        fromDatabase:
          name: voice-orchestrator-db
          property: connectionString
      - key: VOICE_ORCH_OWNER_PASSWORD
        sync: false
      - key: VOICE_ORCH_PROVIDER
        value: fake
      - fromGroup: voice-orchestrator-voice

  - type: worker
    name: voice-orchestrator-worker
    runtime: docker
    dockerfilePath: ./deploy/worker.Dockerfile
    dockerContext: .
    plan: 1c-2g
    region: frankfurt
    autoDeployTrigger: commit
    envVars:
      - key: VOICE_ORCH_DATABASE_URL
        fromDatabase:
          name: voice-orchestrator-db
          property: connectionString
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VOICE_ORCH_PROVIDER
        value: fake
      - key: VOICE_ORCH_MAX_CALL_MINUTES_PER_DAY
        value: "60"
      - fromGroup: voice-orchestrator-voice
