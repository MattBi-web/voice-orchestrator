[project]
name = "voice-orchestrator"
version = "0.1.0"
description = "A configurable family of voice agents (router + nested specialists) with a two-level, latency-first router, scoped memory/handoffs, and pluggable tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matteo Bigi" }]
license = { text = "MIT" }

dependencies = [
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "bm25s>=0.2",
  "anthropic>=0.40",
  "mcp>=1.0,<2.0",  # mcp 2.x renamed FastMCP -> MCPServer with a breaking API change; pinned to what demo_mcp_server.py is actually written against
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
gemini = ["google-generativeai>=0.8"]
dev = ["pytest>=8.0"]

[project.scripts]
voice-orchestrator = "voice_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
