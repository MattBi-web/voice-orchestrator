[project]
name = "voice-orchestrator"
version = "0.1.0"
description = "A configurable family of voice agents (router + nested specialists) with a two-level, latency-first router, scoped memory/handoffs, and pluggable tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matteo Bigi" }]
license = { text = "MIT" }

dependencies = [
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "bm25s>=0.2",
  "anthropic>=0.40",
  "mcp>=1.0,<2.0",  # mcp 2.x renamed FastMCP -> MCPServer with a breaking API change; pinned to what demo_mcp_server.py is actually written against
  "httpx>=0.27",  # blocco 3: tools/webhook_tool.py's HTTP client — a real, first-class dependency now, not just transitively pulled in by anthropic's own SDK
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
gemini = ["google-generativeai>=0.8"]
# The real-time voice layer (src/voice_orchestrator/voice/) — LiveKit
# Agents for transport/session, Deepgram for STT, ElevenLabs for TTS,
# Silero for VAD. Nothing else in this project imports any of these, so
# the CLI/tests/text-core work with none of it installed.
voice = [
  # >=1.8.4: what voice/agent.py is written and verified against
  # (Agent.update_options(tts=...), the reply-needs-an-LLM rule RouterLLM
  # satisfies — see docs/ROADMAP.md D12).
  "livekit-agents>=1.8.4,<2",
  "livekit-plugins-deepgram>=1.8",
  "livekit-plugins-elevenlabs>=1.8",
  "livekit-plugins-silero>=1.8",
  # Blocco 8: the other speech providers the builder offers (catalog.py).
  # Imported only when a project or agent picks them (voice/providers.py).
  "livekit-plugins-openai>=1.8",
  "livekit-plugins-cartesia>=1.8",
  "livekit-plugins-assemblyai>=1.8",
]
# The agent-builder web API (src/voice_orchestrator/webapi/) — a FastAPI
# backend over a SQLite-backed copy of the agent family, for the React
# frontend in web/. Nothing else in this project imports any of these.
# livekit-api is the lightweight token-signing package only (no audio
# plugins) — it mints the live voice test console's room tokens; the
# worker that actually answers still needs the full `voice` extra.
webapi = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "livekit-api>=0.7",
]
# Blocco 6: the Postgres driver for shared mode (VOICE_ORCH_DATABASE_URL).
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
voice-orchestrator = "voice_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
