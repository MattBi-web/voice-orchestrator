# The agent "family" for the demo: a fictional telecom provider's phone line.
# This file IS the family — add, remove, or re-nest an agent by editing it
# (or via `voice-orchestrator agents add/remove`), no code changes needed.
#
# Each node:
#   eligibility     — Level-1 gate expression (routing/gate.py), "" = always eligible
#   triggers        — Level-2 keyword list (routing/classifier.py)
#   tools           — ids resolved against tools/__init__.py's REGISTRY
#   knowledge       — markdown files (data/knowledge/) for the knowledge_lookup tool
#   first_message   — what this agent says before hearing anything (blocco 2), "" = stay silent
#   llm_provider/llm_model/llm_temperature — per-agent LLM override, "" = inherit the call's default
#   voice_id/voice_stability/voice_speed   — per-agent ElevenLabs voice override, "" = inherit worker.py's default
#   children        — nested sub-agents (recursion all the way down)
# Blocco 8: the project block — name, description and the default models
# for every agent (each agent can override any of them, see project.py).
project:
  name: "Meridian Telecom"
  description: "The customer line of a fictional Italian telecom: a receptionist and six specialists, with a gate, keywords, tools, knowledge and an MCP server."
  settings:
    stt_provider: deepgram
    stt_model: nova-3
    stt_language: multi
    tts_provider: elevenlabs
    tts_model: eleven_flash_v2_5
root:
  id: router
  name: "Receptionist"
  description: "Greets the caller and figures out which department they need."
  system_prompt: >
    You are the receptionist for Meridian Telecom's customer line. Greet
    callers briefly, understand what they need, and route them — don't try
    to solve billing, sales, or technical problems yourself.
  first_message: "Meridian Telecom, buongiorno! Come posso aiutarla?"
  tools: ["transfer_to_human", "end_call"]
  children:
    - id: billing
      name: "Billing Agent"
      description: "Handles invoices, payments, balance, and refund questions."
      eligibility: "authenticated == true"
      triggers:
        - bollett
        - fattur
        - pagament
        - pag
        - sald
        - addebit
        - rimbors
        - costo mensile
        - scadenz
      tools:
        # Account lookup only on an authenticated voice call — not over a
        # text/SMS channel, where we don't want balance figures landing in a
        # message thread that could be read by someone else holding the phone.
        - id: check_account_status
          condition: "channel == 'voice'"
        - knowledge_lookup
        - transfer_to_human
        - end_call
      knowledge: ["billing_policy.md"]
      system_prompt: >
        You are Meridian Telecom's billing agent. Answer only from the
        account lookup and knowledge base you're given — never invent a
        figure. Be precise about amounts and dates.
      # Lower temperature than the family default: a billing agent quoting
      # amounts/dates should be the least improvisational voice in the
      # family, not the most helpful-sounding one. Pinned to "fake" here on
      # purpose, same as the family-wide default — this demo config must
      # never silently make a real network call just because someone
      # running the tests happens to have a real provider's API key set in
      # their shell; swap to "anthropic"/"openai"/"gemini" to see this
      # field actually change which model answers.
      llm_provider: "fake"
      llm_temperature: 0.2
      voice_id: "21m00Tcm4TlvDq8ikWAM"  # ElevenLabs "Rachel" — calm, measured
      voice_stability: 0.7

    - id: sales
      name: "Sales & Upgrades Agent"
      description: "Handles new plans, upgrades, and current promotions."
      triggers:
        - upgrad
        - nuovo piano
        - promozion
        - passare a
        - attiv
        - offert
        - cambiare piano
      tools: ["knowledge_lookup", "transfer_to_human", "end_call"]
      knowledge: ["plans_and_offers.md"]
      system_prompt: >
        You are Meridian Telecom's sales agent. Explain plans and offers
        accurately from the knowledge base; don't promise discounts that
        aren't in it.
      voice_id: "EXAVITQu4vr4xnSDxMaL"  # ElevenLabs "Bella" — warmer, upbeat

    - id: roaming
      name: "Roaming & International Agent"
      description: "Handles data roaming rates and service outages abroad, backed by an external MCP tool."
      triggers:
        - roaming
        - estero
        - internazional
      tools: ["mcp:demo", "transfer_to_human", "end_call"]
      system_prompt: >
        You are Meridian Telecom's roaming agent. Use the roaming-rate or
        outage-check tool to answer with real figures; never invent a rate
        or an outage status.

    - id: tech_support
      name: "Technical Support"
      description: "Handles connectivity and hardware problems; routes to the right specialist."
      triggers:
        - non funziona
        - si è rotto
        - non si connette
        - guasto
      tools: ["transfer_to_human", "end_call"]
      system_prompt: >
        You are the Technical Support triage agent. Figure out whether this
        is an internet/connectivity issue or a TV/decoder issue and route
        accordingly — you don't troubleshoot directly yourself.
      children:
        - id: tech_internet
          name: "Internet Connectivity Support"
          description: "Wifi, router, modem, and broadband connectivity troubleshooting, backed by a custom webhook tool for live outage status."
          triggers:
            - wifi
            - router
            - modem
            - internet
            - connession
            - banda larga
            - fibr
            - lent
          tools: ["knowledge_lookup", "webhook:network_status", "transfer_to_human", "end_call"]
          knowledge: ["internet_troubleshooting.md"]
          system_prompt: >
            You are Meridian Telecom's internet troubleshooting specialist.
            Walk the caller through the knowledge-base steps in order; don't
            skip ahead.

        - id: tech_tv
          name: "TV & Set-Top-Box Support"
          description: "Decoder/set-top-box and TV channel troubleshooting."
          triggers:
            - decoder
            - televis
            - canal
            - set-top
            - telecomand
            - tv
          tools: ["knowledge_lookup", "transfer_to_human", "end_call"]
          knowledge: ["tv_troubleshooting.md"]
          system_prompt: >
            You are Meridian Telecom's TV/decoder troubleshooting specialist.
            Walk the caller through the knowledge-base steps in order.
